services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: champions
      POSTGRES_PASSWORD: champions
      POSTGRES_DB: champions_club
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
volumes:
  pgdata:
