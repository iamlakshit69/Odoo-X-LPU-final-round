services:
  db:
    image: postgres:15-alpine
    container_name: champions_club_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: champions_club
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d champions_club"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
