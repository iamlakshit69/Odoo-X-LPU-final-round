services:
  - type: web
    name: champions-club
    env: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:deploy && pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: champions-club-db
          property: connectionString

databases:
  - name: champions-club-db
    plan: free
    postgresMajorVersion: 15
    databaseName: champions_club
    user: club
