<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var t = localStorage.getItem('cc_theme');
        if (t === 'dark' || t === null) document.documentElement.classList.add('dark');
      } catch(e) {}
    </script>
    <title>Champions Club | Elite Sports & Community</title>
    <meta name="description" content="Premier multi-sport club for tennis, padel, badminton, cricket, and community hospitality." />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsActivityLocation",
      "name": "Champions Club",
      "description": "Premier sports facility with tennis, padel, badminton courts, cricket nets, lounge bar and pro shop.",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, Credit Card, UPI"
    }
    </script>
  </head>
  <body class="bg-canvas text-primaryText antialiased selection:bg-accent-orange selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
